name: Build Mac app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15   # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - name: Compile
        run: |
          set +e
          swift build -c release --arch arm64 > build.log 2>&1
          code=$?
          tail -60 build.log
          if [ $code -ne 0 ]; then
            errs=$(grep -E "error:" build.log | sort -u | head -40 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Compile failed::$errs"
            exit 1
          fi

      - name: Check it compiled
        run: test -f .build/arm64-apple-macosx/release/FlowCommand

      # The same signing certificate is reused for every build, so macOS
      # remembers Flow Command's permissions across updates.
      - name: Restore signing certificate
        uses: actions/cache@v4
        with:
          path: signing
          key: flowcommand-signing-v1

      - name: Prepare signing identity
        run: |
          mkdir -p signing
          if [ ! -f signing/cert.p12 ]; then
            echo "Creating a new signing certificate (first build only)"
            printf '[req]\ndistinguished_name=dn\nx509_extensions=ext\nprompt=no\n[dn]\nCN=Flow Command Developer\n[ext]\nkeyUsage=critical,digitalSignature\nextendedKeyUsage=critical,codeSigning\nbasicConstraints=critical,CA:false\n' > signing/cert.cnf
            /usr/bin/openssl req -x509 -newkey rsa:2048 -nodes -keyout signing/key.pem -out signing/cert.pem -days 3650 -config signing/cert.cnf
            /usr/bin/openssl pkcs12 -export -inkey signing/key.pem -in signing/cert.pem -out signing/cert.p12 -passout pass:flowcommand
          fi
          security create-keychain -p ci build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          security unlock-keychain -p ci build.keychain
          security import signing/cert.p12 -k build.keychain -P flowcommand -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci build.keychain >/dev/null
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain signing/cert.pem || true
          security find-identity -v -p codesigning build.keychain || true

      - name: Assemble FlowCommand.app
        run: |
          pip3 install --break-system-packages -q pillow || pip3 install -q pillow
          python3 make_icon.py
          iconutil -c icns icon.iconset -o AppIcon.icns
          APP=dist/FlowCommand.app
          mkdir -p $APP/Contents/MacOS $APP/Contents/Resources
          cp .build/arm64-apple-macosx/release/FlowCommand $APP/Contents/MacOS/FlowCommand
          cp Info.plist $APP/Contents/Info.plist
          cp AppIcon.icns $APP/Contents/Resources/AppIcon.icns
          if codesign --force --deep --keychain build.keychain --sign "Flow Command Developer" $APP; then
            echo "Signed with the stable Flow Command certificate"
          else
            echo "::warning title=Signing::Stable certificate failed — falling back to ad-hoc (permissions will reset on update)"
            codesign --force --deep --sign - $APP
          fi
          codesign --verify --verbose $APP
          codesign -d -r- $APP 2>&1 | tail -2

      - name: Self-test (logic)
        run: |
          out=$(dist/FlowCommand.app/Contents/MacOS/FlowCommand --selftest 2>&1) || { echo "::error title=Self-test failed::$out"; exit 1; }
          echo "$out"

      - name: Launch test (one copy only, no runaway, stays up)
        run: |
          APP=dist/FlowCommand.app/Contents/MacOS/FlowCommand
          "$APP" & sleep 3
          "$APP" & "$APP" &
          for i in $(seq 1 8); do
            sleep 3
            n=$(pgrep -x FlowCommand | wc -l | tr -d ' ')
            echo "t=$((3 + i*3))s  FlowCommand processes: $n"
            if [ "$n" -gt 1 ]; then echo "::error title=Launch test::more than one copy ($n)"; pgrep -lf FlowCommand; pkill -9 -x FlowCommand; exit 1; fi
          done
          n=$(pgrep -x FlowCommand | wc -l | tr -d ' ')
          if [ "$n" -ne 1 ]; then echo "::error title=Launch test::app did not stay running"; exit 1; fi
          echo "CPU of the running app:"; ps -o %cpu=,rss= -p $(pgrep -x FlowCommand)
          pkill -x FlowCommand || true

      - name: Make installer (.dmg)
        run: |
          mkdir dmg
          cp -R dist/FlowCommand.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Flow Command" -srcfolder dmg -ov -format UDZO FlowCommand.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: FlowCommand-mac
          path: FlowCommand.dmg

      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest FlowCommand.dmg \
            --title "Flow Command for Mac (latest)" \
            --notes "Download **FlowCommand.dmg** below, open it, and drag Flow Command into Applications."
