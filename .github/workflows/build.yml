name: Build Mac app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14   # Apple Silicon (M1/M2/M3/M4)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt pyinstaller pillow

      - name: Make app icon
        run: |
          python make_icon.py
          iconutil -c icns icon.iconset -o icon.icns

      - name: Build app
        run: pyinstaller --noconfirm FlowCommand.spec

      - name: Self-test the built app
        run: |
          dist/FlowCommand.app/Contents/MacOS/FlowCommand --selftest
          sleep 5
          left=$(pgrep -x FlowCommand | wc -l | tr -d ' ')
          echo "FlowCommand processes left after self-test: $left"
          [ "$left" -eq 0 ] || { pgrep -lf FlowCommand; exit 1; }

      - name: Real-launch test (no runaway copies, single instance)
        run: |
          APP=dist/FlowCommand.app/Contents/MacOS/FlowCommand
          "$APP" & "$APP" & "$APP" &
          # first launch downloads the speech model — the step that misbehaved in v1
          for i in $(seq 1 18); do
            sleep 5
            n=$(pgrep -x FlowCommand | wc -l | tr -d ' ')
            echo "t=$((i*5))s  FlowCommand processes: $n"
            if [ "$n" -gt 2 ]; then echo "RUNAWAY DETECTED"; pgrep -lf FlowCommand; pkill -9 -x FlowCommand; exit 1; fi
          done
          grep -q "model ready" ~/Library/Logs/FlowCommand.log && echo "model loaded OK" || { echo "model did not load"; cat ~/Library/Logs/FlowCommand.log; pkill -9 -x FlowCommand; exit 1; }
          pkill -9 -x FlowCommand || true

      - name: Make installer (.dmg)
        run: |
          mkdir dmg
          cp -R dist/FlowCommand.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Flow Command" -srcfolder dmg -ov -format UDZO FlowCommand.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: FlowCommand-mac
          path: FlowCommand.dmg

      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest FlowCommand.dmg \
            --title "Flow Command for Mac (latest)" \
            --notes "Download **FlowCommand.dmg** below, open it, and drag Flow Command into Applications."
