name: Build Mac app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15   # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - name: Compile
        run: |
          set +e
          swift build -c release --arch arm64 > build.log 2>&1
          code=$?
          tail -60 build.log
          if [ $code -ne 0 ]; then
            errs=$(grep -E "error:" build.log | sort -u | head -40 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Compile failed::$errs"
            exit 1
          fi

      - name: Check it compiled
        run: test -f .build/arm64-apple-macosx/release/FlowCommand

      - name: Assemble FlowCommand.app
        run: |
          pip3 install --break-system-packages -q pillow || pip3 install -q pillow
          python3 make_icon.py
          iconutil -c icns icon.iconset -o AppIcon.icns
          APP=dist/FlowCommand.app
          mkdir -p $APP/Contents/MacOS $APP/Contents/Resources
          cp .build/arm64-apple-macosx/release/FlowCommand $APP/Contents/MacOS/FlowCommand
          cp Info.plist $APP/Contents/Info.plist
          cp AppIcon.icns $APP/Contents/Resources/AppIcon.icns
          codesign --force --deep --sign - $APP
          codesign --verify --verbose $APP

      - name: Self-test (logic)
        run: |
          out=$(dist/FlowCommand.app/Contents/MacOS/FlowCommand --selftest 2>&1) || { echo "::error title=Self-test failed::$out"; exit 1; }
          echo "$out"

      - name: Launch test (one copy only, no runaway, stays up)
        run: |
          APP=dist/FlowCommand.app/Contents/MacOS/FlowCommand
          "$APP" & sleep 3
          "$APP" & "$APP" &
          for i in $(seq 1 8); do
            sleep 3
            n=$(pgrep -x FlowCommand | wc -l | tr -d ' ')
            echo "t=$((3 + i*3))s  FlowCommand processes: $n"
            if [ "$n" -gt 1 ]; then echo "::error title=Launch test::more than one copy ($n)"; pgrep -lf FlowCommand; pkill -9 -x FlowCommand; exit 1; fi
          done
          n=$(pgrep -x FlowCommand | wc -l | tr -d ' ')
          if [ "$n" -ne 1 ]; then echo "::error title=Launch test::app did not stay running"; exit 1; fi
          echo "CPU of the running app:"; ps -o %cpu=,rss= -p $(pgrep -x FlowCommand)
          pkill -x FlowCommand || true

      - name: Make installer (.dmg)
        run: |
          mkdir dmg
          cp -R dist/FlowCommand.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Flow Command" -srcfolder dmg -ov -format UDZO FlowCommand.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: FlowCommand-mac
          path: FlowCommand.dmg

      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest FlowCommand.dmg \
            --title "Flow Command for Mac (latest)" \
            --notes "Download **FlowCommand.dmg** below, open it, and drag Flow Command into Applications."
